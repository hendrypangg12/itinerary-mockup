name: Build site (extract bundle + Commons photos)
on:
  push:
    branches: [main]
    paths: ['bundle/READY']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-site
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract site bundle (sha256 dicek)
        run: |
          if [ -f bundle/READY ]; then
            cat bundle/site.b64.* | base64 -d > site.tar.xz
            echo "$(tr -d ' \n\r' < bundle/READY)  site.tar.xz" | sha256sum -c -
            python3 -c "import lzma,tarfile;tarfile.open(fileobj=lzma.open('site.tar.xz')).extractall('.')"
            rm -rf bundle site.tar.xz
          fi
          if [ -f _post.py ]; then python3 _post.py && rm -f _post.py; fi
          ls -la
      - name: Download Commons photos (max 1024 px)
        run: |
          pip install --quiet pillow
          python3 build_photos.py
          ls photos | wc -l
          du -sh photos
      - name: Commit built site to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Build site: extract bundle + Commons photos (max 1024px)"
          git push
      - name: Update gh-pages (live site) to the same commit
        run: git push origin HEAD:gh-pages
