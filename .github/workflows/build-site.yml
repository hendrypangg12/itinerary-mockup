name: Build site (extract bundle + Commons photos)
on:
  push:
    branches: [main]
    paths: ['bundle/**', '.github/workflows/build-site.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-site
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract site bundle
        run: |
          if [ -d bundle ]; then
            cat bundle/site.b64.* | base64 -d > site.tar.xz
            python3 -c "import lzma,tarfile;tarfile.open(fileobj=lzma.open('site.tar.xz')).extractall('.')"
            rm -rf bundle site.tar.xz
          fi
          ls -la
      - name: Download Commons photos (max 1024 px)
        run: |
          pip install --quiet pillow
          python3 build_photos.py
          ls photos | wc -l
          du -sh photos
      - name: Commit built site to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Build site: extract bundle + Commons photos (max 1024px)"
          git push
